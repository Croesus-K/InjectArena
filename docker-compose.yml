# 攻心 InjectArena —— 一键自部署
# 用法：在本目录放好 .env（照 .env.example 填 BASE_URL / API_KEY / MODEL），然后
#   docker compose up -d
# 打开 http://127.0.0.1:8787
services:
  injectarena:
    build: .
    ports:
      - "8787:8787"
    environment:
      # compose 自动读取同目录 .env 做变量替换：key 只进容器内存，不落镜像
      INJECTARENA_BASE_URL: ${INJECTARENA_BASE_URL:-}
      INJECTARENA_API_KEY: ${INJECTARENA_API_KEY:-}
      INJECTARENA_MODEL: ${INJECTARENA_MODEL:-}
      INJECTARENA_EVAL_CONCURRENCY: ${INJECTARENA_EVAL_CONCURRENCY:-4}
    volumes:
      - injectarena-data:/data
    restart: unless-stopped

volumes:
  injectarena-data:
